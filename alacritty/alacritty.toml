[general]
# colors come from u-da-real-ricing; skipped if missing (Alacritty ignores absent imports)
import               = [ "~/.config/alacritty/colors.toml" ]

[terminal.shell]
program               = "/usr/bin/zsh"
args                  = [ "--login", ]

[window]
padding               = { x = 2, y = 2 }
decorations           = "None"
opacity               = 1.0
blur                  = true

[scrolling]
history               = 65535

[font]
normal                = { family = "InconsolataNerdFont", style = "Regular" }
bold                  = { family = "InconsolataNerdFont", style = "Bold" }
italic                = { family = "InconsolataNerdFont", style = "Italic" }
bold_italic           = { family = "InconsolataNerdFont", style = "Bold Italic" }
offset                = { x = 0, y = 0 }
glyph_offset          = { x = 0, y = 0 }
