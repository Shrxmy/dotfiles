# eza theme matching the Retro Clean palette (oh-my-posh / Claude Code / pi)
# amber #cc9166  sand #d9ac8c  text #c6c0b9  muted #8a8a8a  subtle #4d4d4d
# mauve #b894af  sage #778c73  rose #a97070  slate #8a99a8
colourful: true

filekinds:
  normal: { foreground: "#c6c0b9" }
  directory: { foreground: "#cc9166", is_bold: true }
  symlink: { foreground: "#8a99a8" }
  executable: { foreground: "#778c73", is_bold: true }
  pipe: { foreground: "#b894af" }
  socket: { foreground: "#b894af" }
  block_device: { foreground: "#d9ac8c" }
  char_device: { foreground: "#d9ac8c" }
  special: { foreground: "#b894af" }
  mount_point: { foreground: "#8a99a8", is_underline: true }

file_type:
  image: { foreground: "#c6c0b9" }
  video: { foreground: "#c6c0b9" }
  music: { foreground: "#c6c0b9" }
  lossless: { foreground: "#c6c0b9" }
  document: { foreground: "#c6c0b9" }
  compressed: { foreground: "#c6c0b9" }
  crypto: { foreground: "#c6c0b9" }
  source: { foreground: "#c6c0b9" }
  build: { foreground: "#c6c0b9", is_underline: true }
  compiled: { foreground: "#8a8a8a" }
  temp: { foreground: "#4d4d4d" }

perms:
  user_read: { foreground: "#d9ac8c" }
  user_write: { foreground: "#cc9166" }
  user_execute_file: { foreground: "#778c73", is_bold: true }
  user_execute_other: { foreground: "#778c73" }
  group_read: { foreground: "#8a8a8a" }
  group_write: { foreground: "#8a8a8a" }
  group_execute: { foreground: "#8a8a8a" }
  other_read: { foreground: "#4d4d4d" }
  other_write: { foreground: "#4d4d4d" }
  other_execute: { foreground: "#4d4d4d" }
  special_user_file: { foreground: "#b894af" }
  special_other: { foreground: "#b894af" }
  attribute: { foreground: "#8a8a8a" }

size:
  major: { foreground: "#d9ac8c" }
  minor: { foreground: "#8a8a8a" }
  number_byte: { foreground: "#8a8a8a" }
  number_kilo: { foreground: "#c6c0b9" }
  number_mega: { foreground: "#d9ac8c" }
  number_giga: { foreground: "#cc9166", is_bold: true }
  number_huge: { foreground: "#a97070", is_bold: true }
  unit_byte: { foreground: "#4d4d4d" }
  unit_kilo: { foreground: "#8a8a8a" }
  unit_mega: { foreground: "#8a8a8a" }
  unit_giga: { foreground: "#cc9166" }
  unit_huge: { foreground: "#a97070" }

users:
  user_you: { foreground: "#d9ac8c" }
  user_root: { foreground: "#a97070", is_bold: true }
  user_other: { foreground: "#8a8a8a" }
  group_yours: { foreground: "#8a8a8a" }
  group_root: { foreground: "#a97070" }
  group_other: { foreground: "#4d4d4d" }

links:
  normal: { foreground: "#8a99a8" }
  multi_link_file: { foreground: "#8a99a8", is_bold: true }

git:
  new: { foreground: "#778c73" }
  modified: { foreground: "#cc9166" }
  deleted: { foreground: "#a97070" }
  renamed: { foreground: "#8a99a8" }
  typechange: { foreground: "#b894af" }
  ignored: { foreground: "#4d4d4d" }
  conflicted: { foreground: "#a97070", is_bold: true }

git_repo:
  branch_main: { foreground: "#778c73" }
  branch_other: { foreground: "#cc9166" }
  git_clean: { foreground: "#778c73" }
  git_dirty: { foreground: "#cc9166" }

punctuation: { foreground: "#4d4d4d" }
date: { foreground: "#8a99a8" }
header: { foreground: "#c6c0b9", is_underline: true }
symlink_path: { foreground: "#8a99a8" }
broken_symlink: { foreground: "#a97070" }
broken_path_overlay: { is_underline: true }
control_char: { foreground: "#a97070" }
inode: { foreground: "#8a8a8a" }
blocks: { foreground: "#8a8a8a" }
octal: { foreground: "#8a8a8a" }

