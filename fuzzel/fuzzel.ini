[main]
font=Inconsolata Nerd Font:size=13
terminal=alacritty -e
prompt="❯ "
icon-theme=breeze-dark
width=38
lines=10
horizontal-pad=18
vertical-pad=12
inner-pad=8

[colors]
background=25222add
text=c6c0b9ff
prompt=cc9166ff
input=d9ac8cff
placeholder=8a8a8aff
match=cc9166ff
selection=3d3d40ff
selection-text=d9ac8cff
selection-match=cc9166ff
border=cc9166ff

[border]
width=3
radius=0

# accent colors follow the wallpaper (generated by hypr/wallpaper.sh); must stay last to override [colors]
[main]
include=~/.local/state/wallpaper/fuzzel.ini
