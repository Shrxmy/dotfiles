# hyprlock — Retro Clean
general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.local/state/wallpaper/current
    blur_passes = 2
    blur_size = 4
    contrast = 0.8
    brightness = 0.55
    vibrancy = 0.16
    vibrancy_darkness = 0.05
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(198, 192, 185, 0.8)
    font_size = 24
    font_family = Inconsolata Nerd Font Bold
    position = 0, 250
    halign = center
    valign = center
}

# clock
label {
    monitor =
    text = $TIME
    color = rgba(217, 172, 140, 0.95)
    font_size = 120
    font_family = Inconsolata Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

# user pill
shape {
    monitor =
    size = 300, 56
    color = rgba(37, 34, 42, 0.55)
    rounding = -1
    border_size = 2
    border_color = rgba(204, 145, 102, 0.6)
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = rgba(198, 192, 185, 0.9)
    font_size = 18
    font_family = Inconsolata Nerd Font Bold
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 56
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    outer_color = rgba(204, 145, 102, 0.9)
    inner_color = rgba(37, 34, 42, 0.55)
    font_color = rgb(198, 192, 185)
    check_color = rgb(119, 140, 115)
    fail_color = rgb(169, 112, 112)
    fail_text = <i>try again</i>
    placeholder_text = <span foreground="##8a8a8a">password</span>
    fade_on_empty = false
    rounding = -1
    position = 0, -120
    halign = center
    valign = center
}
