# Lenovo's Hybrid-Auto BIOS mode pulls the NVIDIA GPU when the charger is unplugged, and Hyprland
# (aquamarine 0.55) dies when a DRM card disappears, even one it isn't using. CUDA/PyTorch only need
# the nvidia + nvidia_uvm modules, so don't autoload NVIDIA's display driver (no /dev/dri/card1).
# External screen (HDMI/DP are wired to the NVIDIA GPU): sudo modprobe nvidia_drm, then log out and in.
# Install: sudo install -m 644 modprobe/no-nvidia-display.conf /etc/modprobe.d/
blacklist nvidia_drm
