# Draw the SDDM login screen with Wayland (KWin) instead of an X server. The X server otherwise keeps
# running behind the Hyprland session (~130 MB). Session choice is unaffected: Hyprland, Plasma (Wayland)
# and Plasma (X11) all still work.
# Install: sudo install -m 644 sddm/10-wayland-greeter.conf /etc/sddm.conf.d/   (takes effect next boot)
# Undo (e.g. from a text console, Ctrl+Alt+F2): sudo rm /etc/sddm.conf.d/10-wayland-greeter.conf && sudo systemctl restart sddm
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
