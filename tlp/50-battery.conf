# Battery runtime + lifespan (Lenovo LOQ: i5-13450HX + RTX 4050). Only overrides TLP 1.8 defaults.
# Install: sudo install -m 644 tlp/50-battery.conf /etc/tlp.d/ && sudo tlp start

# CPU: no turbo bursts and a power-saving preference on battery; AC stays as before.
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# Hands off the NVIDIA GPU (01:00.0 + its audio 01:00.1): Lenovo's Hybrid-Auto removes it on battery, and
# TLP touching the half-removed device hung `tlp auto`. Its driver enables runtime PM itself (60-nvidia.rules).
RUNTIME_PM_DENYLIST="01:00.0 01:00.1"
PCIE_ASPM_ON_BAT=powersupersave

# USB autosuspend skips audio and input devices by default; these two are safe to let sleep:
# ITE 8295 = keyboard RGB controller (only used when setting a color), Razer Seiren Mini mic (only sleeps when unused)
USB_ALLOWLIST="048d:c993 1532:0531"

# Bluetooth starts off at every boot (BlueZ would otherwise power it on); turn it on when needed.
DEVICES_TO_DISABLE_ON_STARTUP="bluetooth"

# Lenovo conservation mode: holds the battery at ~60% while plugged in (ideapad_laptop; all batteries use BAT0).
# One-off full charge before a trip: sudo tlp fullcharge
STOP_CHARGE_THRESH_BAT0=1
